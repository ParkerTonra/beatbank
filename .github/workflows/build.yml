name: 'Publish Release'

on:
  push:
    branches:
      - pyinstallerimprover

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            arch: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            arch: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            arch: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: ''
            arch: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src-tauri/requirements.txt
          pip install pyinstaller

      - name: Compile Librosa
        run: python src-tauri/src/compile_librosa.py

      - name: Build PyInstaller Binary
        run: |
          cd src-tauri/src
          pyinstaller --onefile --name audio_analyzer-${{ matrix.arch }} \
            --hidden-import numpy \
            --hidden-import librosa.core \
            --hidden-import librosa.feature.rhythm \
            --hidden-import librosa.onset \
            --hidden-import librosa.feature \
            --hidden-import librosa.util \
            --hidden-import resampy \
            --hidden-import scipy.signal \
            --hidden-import llvmlite \
            --hidden-import numba \
            --hidden-import librosa_compiled \
            audio_analyzer.py

      - name: Copy Binary
        shell: bash
        run: |
          mkdir -p src-tauri/dist src-tauri/releases
          cp src-tauri/src/dist/audio_analyzer-${{ matrix.arch }}* src-tauri/dist/
          cp src-tauri/src/dist/audio_analyzer-${{ matrix.arch }}* src-tauri/releases/

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.10.0

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}